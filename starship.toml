# Starship configuration — Typecraft-style segmented prompt
# Designed for Bash on Linux / CachyOS

palette = "typecraft"

format = """
$custom.typecraft\
$custom.directory\
$custom.arrow1\
$custom.arrow2\
$custom.arrow3\
$fill
$time\
$line_break\
$character
"""

right_format = ""

[palettes.typecraft]
bg_dark = "#252838"
bg_orange = "#F2A65A"
bg_blue = "#5DADE2"
bg_green = "#69C7A5"
bg_pink = "#E6A6C7"
text = "#E8EAF0"
text_dark = "#20222C"

[custom.typecraft]
command = "printf '  ◢ typecraft '"
when = "true"
format = "[$output]($style)"
style = "fg=white bg=bg_dark"

[custom.directory]
command = "printf ' ~ '"
when = "true"
format = "[$output]($style)"
style = "fg=text_dark bg=bg_orange"

[custom.arrow1]
command = "printf ''"
when = "true"
format = "[$output]($style)"
style = "fg=bg_orange bg=bg_blue"

[custom.arrow2]
command = "printf ''"
when = "true"
format = "[$output]($style)"
style = "fg=bg_blue bg=bg_green"

[custom.arrow3]
command = "printf ''"
when = "true"
format = "[$output]($style)"
style = "fg=bg_green bg=bg_pink"

[time]
disabled = false
time_format = "%H:%M"
format = "[ 󰥔 $time ]($style)"
style = "fg=text_dark bg=bg_pink"

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold fg=bg_green)"
error_symbol = "[❯](bold fg=red)"

[line_break]
disabled = true
